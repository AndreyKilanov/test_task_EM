networks:
  resources-service:
    driver: bridge

volumes:
  pg_backend_data_volume:
  resources-static-volume:
  resources-media-volume:

services:
  postgres:
    image: postgres:latest
    container_name: resources-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: always
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_backend_data_volume:/var/lib/postgresql/data
    networks:
      - resources-service

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resources-backend
    env_file:
      - .env
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - resources-media-volume:/app/media
      - resources-static-volume:/app/staticfiles
    depends_on:
      - postgres
    networks:
      - resources-service

  nginx:
    container_name: resources-nginx
    image: nginx:1.28.0-alpine-slim
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - resources-media-volume:/app/media
      - resources-static-volume:/app/staticfiles
    depends_on:
      - backend
    networks:
      - resources-service
